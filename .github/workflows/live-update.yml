name: Live market snapshot (read-only)

on:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh live snapshot
        run: python update_live_site.py

      - name: Commit and push live.json
        run: |
          git config user.name "tr-bot-live"
          git config user.email "tr-bot-live@users.noreply.github.com"
          git add docs/live.json share/live.json
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: refresh read-only live market snapshot"
            git push
          fi
