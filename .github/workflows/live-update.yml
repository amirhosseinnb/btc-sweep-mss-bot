name: Live market snapshot (read-only)

on:
  schedule:
    # Every 2 hours, offset from :00 to reduce GitHub schedule drops.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-update.yml"
      - "update_live_site.py"
      - "download_data.py"
      - "paper_trader.py"
      - "paper_journal.py"
      - "live_diagnostics.py"
      - "build_performance_json.py"
      - "scoring.py"
      - "rulebook.py"
      - "core_strategy.py"
      - "validate.py"
      - "targets.py"
      - "jalali.py"
      - "notify_telegram.py"

permissions:
  contents: write

concurrency:
  group: ajv-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download market history (read-only)
        run: |
          mkdir -p data
          python download_data.py --symbol BTCUSDT --timeframe 4h --days 1460
          python download_data.py --symbol ETHUSDT --timeframe 4h --days 1460
          python download_data.py --symbol SOLUSDT --timeframe 4h --days 1460

      - name: Paper journal (multi-symbol + outcomes)
        run: |
          python paper_journal.py --check --resolve --days 400 --preset javid
          # Seed once if journal is still empty (first deploy / cold start).
          if [ ! -f data/paper_signals.csv ] || [ ! -s data/paper_signals.csv ]; then
            python paper_journal.py --seed --resolve --days 400 --preset javid
          fi

      - name: Refresh live snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update_live_site.py

      - name: Rebuild performance + readiness report
        run: python build_performance_json.py

      - name: Commit and push snapshots
        run: |
          git config user.name "ajv-live"
          git config user.email "ajv-live@users.noreply.github.com"
          git add \
            docs/live.json share/live.json \
            docs/performance.json share/performance.json \
            docs/paper_readiness.json share/paper_readiness.json \
            docs/paper_journal.json share/paper_journal.json \
            data/paper_signals.csv data/paper_checks.csv \
            data/paper_outcomes.json data/paper_readiness.json \
            data/paper_state.json data/paper_state_*.json \
            data/telegram_notified.json || true
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: refresh paper journal + live market + performance"
          git push origin HEAD:main
